name: iOS build and TestFlight

# What this does
#   1. engine-tests : runs the music-engine unit tests on Linux (fast and cheap).
#   2. ios          : builds the iPhone app on a Mac. If your Apple secrets are saved in this
#                     repository (see README.md), it also signs the app and uploads it to TestFlight.
#
# The upload step only runs for the `main` branch, or when you press "Run workflow" by hand.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (needs the Apple secrets)"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-tests:
    name: Music engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        working-directory: Packages/BlazeEngine
        run: swift test -c release -Xswiftc -enable-testing

  ios:
    name: Build app (and upload to TestFlight)
    needs: engine-tests
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Optional: set a repository variable called BUNDLE_ID to use your own bundle id.
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.stormblazerplayz.blazeraw' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i -E 'beta|rc|candidate' | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then
            echo "Using $XC"
            sudo xcode-select -s "$XC/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for the iPhone simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlazeRaw.xcodeproj \
            -scheme BlazeRaw \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            | tail -n 40

      - name: Check for Apple secrets
        id: apple
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          WANT_UPLOAD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.upload }}" = "true" ] && WANT_UPLOAD=true
          elif [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            WANT_UPLOAD=true
          fi
          if [ "$WANT_UPLOAD" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build checked. The TestFlight upload only runs on the main branch or a manual run."
          elif [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple secrets are missing, so nothing was uploaded to TestFlight. Follow the steps in README.md."
          fi

      - name: Save the App Store Connect key
        if: steps.apple.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          # The secret can hold the raw .p8 text, or the same text converted to base64.
          if printf '%s' "$KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive the app
        if: steps.apple.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # The archive is left unsigned; the export step below signs it with a cloud-managed
          # Apple Distribution certificate (so no certificates have to be stored in GitHub).
          xcodebuild archive \
            -project BlazeRaw.xcodeproj \
            -scheme BlazeRaw \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BlazeRaw.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40

      - name: Sign and export the IPA
        if: steps.apple.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BlazeRaw.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tail -n 40
          ls -la "$RUNNER_TEMP/export"
          echo "IPA_PATH=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" >> "$GITHUB_ENV"

      - name: Keep a copy of the IPA
        if: steps.apple.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlazeRaw-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.apple.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportUpload.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          if xcrun altool --upload-app --type ios --file "$IPA_PATH" \
               --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"; then
            echo "Uploaded with altool."
          else
            echo "::warning::altool failed, trying the Xcode upload instead."
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/BlazeRaw.xcarchive" \
              -exportPath "$RUNNER_TEMP/export-upload" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportUpload.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_PATH" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          fi
          echo "::notice::Uploaded! After Apple finishes processing (about 5 to 30 minutes) the build shows up in TestFlight."

      - name: Delete the key from the Mac
        if: always() && steps.apple.outputs.ready == 'true'
        run: rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
